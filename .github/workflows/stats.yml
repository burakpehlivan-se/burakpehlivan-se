name: Generate stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&count_private=true&include_all_commits=true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=radical&hide_border=true&count_private=true

      - name: Commit and push SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update stats cards"
          git push
